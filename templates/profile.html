{% extends g.base_template %}
{% from '_icons.html' import icon %}
{% block title %}{{ t('Профиль') }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t('Профиль') }}</h1>
</div>

<div class="card" style="max-width:560px;">
    <div class="card-body">
        <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="phInput">{{ t('Логин') }}</label>
                <input id="phInput" type="text" value="{{ current_user.username }}" disabled style="background:var(--surface2);">
            </div>
            <div class="form-group">
                <label for="phInput2">{{ t('Роль') }}</label>
                <input id="phInput2" type="text" value="{{ current_user.role_display }}" disabled style="background:var(--surface2);">
            </div>
            <div class="form-group">
                <label for="phFullname">{{ t('Тўлиқ исм') }}</label>
                <input id="phFullname" type="text" name="full_name" value="{{ current_user.full_name }}">
            </div>
            <hr style="margin:20px 0; border:none; border-top:1px solid var(--border);">
            <div class="form-group">
                <label for="phCurrentPassword">{{ t('Жорий парол') }} <span class="text-muted text-sm">({{ t('паролни ўзгартириш учун') }})</span></label>
                <input type="password" id="phCurrentPassword" name="current_password" placeholder="••••••">
            </div>
            <div class="form-group">
                <label for="phNewPassword">{{ t('Янги парол') }} <span class="text-muted text-sm">({{ t('камида 8 белги') }})</span></label>
                <input type="password" id="phNewPassword" name="new_password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="phConfirmpassword">{{ t('Паролни тасдиқланг') }}</label>
                <input id="phConfirmpassword" type="password" name="confirm_password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">{{ icon('save', 15) }} {{ t('Сақлаш') }}</button>
        </form>
    </div>
</div>
{% endblock %}
