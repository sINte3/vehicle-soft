# PHASE1-PR1: syntax + template checks on every PR and every push to main.
#
# Deliberately NOT here:
#   - tools/check_migration_drift.py -- needs a real database;
#   - tools/state_snapshot.py        -- needs a real worktree and services.
# Both run on the server as deploy steps, not in CI.
#
# Their SELF-TESTS do run here (TOOLS-TRUST-001). Those build their own
# temporary SQLite files and their own holder process, so they need no real
# database, no server and no Windows-specific path.
#
# Python 3.12 on the runner is enough: the server runs 3.14, but CI only
# needs to parse and byte-compile the sources.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jinja2 (the only non-stdlib dependency of the checks)
        run: pip install jinja2

      - name: Byte-compile every Python source
        run: python -m compileall -q .

      - name: Template checks (parse, div balance, tojson-in-attr, set-before-use)
        run: python tools/check_templates.py

      - name: Template checker self-test against planted fixtures
        run: python tools/test_check_templates.py

      - name: Database-lock checker self-test (TOOL-DBLOCK-WAL-001)
        run: python tools/test_check_db_lock.py

      - name: Migration-drift checker self-test (TOOL-DRIFT-LEGACY-001)
        run: python tools/test_check_migration_drift.py

      # UI-P7: the design-system ratchet. It counts one-off table classes,
      # colours bypassing tokens, breakpoints off the scale, duplicate tokens,
      # CSS inside templates, glyphs in markup and t() keys missing from
      # translations.py, and allows those counts only to DECREASE.
      #
      # It ran by hand for the whole of P6, which is exactly why t-key-missing
      # sat at 17 unnoticed until the owner saw Russian text on a screen. A
      # ratchet nobody turns is not a ratchet.
      #
      # Needs no database and no server: stdlib only, it never imports app
      # (create_app() calls db.create_all(), which would make a checker a
      # writer).
      - name: Design-system ratchet (counts may only decrease)
        run: python tools/check_design_system.py

      - name: Design-system checker self-test against planted fixtures
        run: python tools/test_check_design_system.py

      - name: Dictionary integrity (no key redefined, both languages present)
        run: python -m unittest tests.test_translations_integrity

      # DRONE-COVERAGE-001. Both are stdlib-only and build their fixtures in
      # memory: no network, no browser, no database, nothing to install. The
      # decoder tests carry the negative result of the whole discovery -- that
      # a DJI route point is two coordinates and nothing more -- so they have
      # to fail loudly the day DJI changes that, not the day someone notices.
      - name: DJI route decoder (drone_collector/route_decode.py)
        run: python -m unittest drone_collector.tests.test_route_decode

      - name: Route probe self-test, including the secret-leak warning
        run: python tools/test_drone_route_probe.py

      # A2/A3. Both are stdlib-only apart from openpyxl, which the fleet audit
      # needs to write its report; they build their own SQLite fixtures in a
      # temporary directory and never touch a real database. The fleet audit
      # carries the proof that it cannot write: sha256 before and after, and a
      # DELETE that SQLite itself must refuse.
      - name: Install openpyxl (the fleet audit writes an xlsx)
        run: pip install openpyxl

      - name: Fleet audit self-test (read-only proof, positive and negative controls)
        run: python tools/test_drone_area_anomaly_probe.py

      - name: Field geometry probe self-test (format detection, no guessing)
        run: python tools/test_drone_field_geometry_probe.py

      # DRONE-COVERAGE-001 stage B. Stdlib only: no network, no browser, no
      # database, nothing to install. Three of these carry properties that
      # are cheap to break and expensive to notice -- that a torn write
      # leaves nothing behind, that a repeat run queues nothing twice, and
      # that a signed link reaches no file, no log and no exception. They
      # have to fail on the commit that breaks them, not on the day someone
      # reads the queue directory.
      - name: Stage B outbox (atomicity, idempotence, secrets, Windows names)
        run: python -m unittest drone_collector.tests.test_outbox

      - name: Stage B route collection (pairing, retries, resume, dry run)
        run: python -m unittest drone_collector.tests.test_routes

      - name: Stage B field geometry (the signed link escapes nowhere)
        run: python -m unittest drone_collector.tests.test_geometry

      - name: Stage B CLI wiring (usage rules and the exit-code namespace)
        run: python -m unittest drone_collector.tests.test_cli

      # The live pilot of 2026-08-27 lost its first run to a thirty-byte
      # storage state that passed a "the file is not empty" check, and its
      # route run to a JSON refusal that was filed as a corrupt protobuf.
      # Both are held here now.
      - name: Saved session (structural check, atomic save, no value leaks)
        run: python -m unittest drone_collector.tests.test_session

      - name: Route payload (vendor refusal is not a broken protobuf)
        run: python -m unittest drone_collector.tests.test_route_payload

      - name: Route UI probe (observes, never asks, never queues)
        run: python -m unittest drone_collector.tests.test_route_ui_probe

      - name: Route semantics probe self-test (observations, never verdicts)
        run: python tools/test_drone_route_semantics_probe.py

      # The first-live-run runbook is a set of ready-to-paste PowerShell
      # commands, and pasted they will be. Twice already it named something
      # that does not exist on the server -- a repository path, then a python
      # without Playwright -- and both times a person caught it, not a check.
      - name: Stage B runbook (venv python, real path, one named contour)
        run: python tools/test_drone_stage_b_runbook.py

      # DRONE-USEFUL-AREA-001. The collector half is stdlib-only and builds
      # its fixtures in memory: no network, no browser, no database. It holds
      # the three properties that are cheap to break and expensive to notice
      # -- that a body which fails to decode is COUNTED rather than swallowed,
      # that an incomplete capture queues nothing at all, and that an envelope
      # is marked sent only AFTER the endpoint accepted it.
      - name: Route collection (capture, queue, drain, exit codes)
        run: python -m unittest drone_collector.tests.test_route_ui_collect

      # The useful-area formula and the spatial grouping it stands on. A work
      # is a CONNECTED COMPONENT of route intersections: a later route that
      # crosses two earlier ones merges them into one work, and the result
      # does not depend on the order the rows arrive in. Getting that wrong
      # counts the overlap of two parts of one work twice, which is the exact
      # error the whole measurement exists to avoid.
      - name: Area study (coverage arithmetic, contour choice, grouping)
        run: python -m unittest drone_collector.tests.test_area_study

      # The migration's four paths, its identity constraints, and the rule the
      # owner cares about most -- that drone_flights.area_ha is byte-identical
      # before and after. Stdlib sqlite3 only: it never imports the app, so it
      # fits this workflow's dependency contract unchanged.
      - name: Useful area migration (four paths, identity, area untouched)
        run: python -m unittest tests.test_drone_useful_area_migration_001

      # [REASON]: tests/test_drone_useful_area_001.py -- the whole vertical
      # from route_sync through the recompute to /drones/coverage -- is NOT
      # listed here, and that is deliberate. It needs Flask, flask-sqlalchemy
      # and flask-login, and no step of this workflow installs or imports the
      # application: every check above is stdlib plus jinja2 and openpyxl.
      # Adding the application's dependencies to CI would change that contract
      # for all four tracks, which is not this increment's to decide. The
      # suite runs locally and on the server with:
      #
      #   python -m unittest discover -s tests
